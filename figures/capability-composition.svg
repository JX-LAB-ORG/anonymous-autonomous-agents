  <g font-size="21" text-anchor="middle" font-weight="600">
    <text x="600" y="164">Autonomous Research</text>
    <text x="600" y="264">Autonomous Action</text>
    <text x="600" y="364">Autonomous Propagation</text>
    <text x="600" y="464">Resource Acquisition</text>
    <text x="600" y="564">Persistence</text>
    <text x="600" y="664">Feedback &amp; Adaptation</text>

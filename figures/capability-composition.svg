    <path d="M590 316 L600 325 L610 316 Z"/>
    <path d="M590 416 L600 425 L610 416 Z"/>
    <path d="M590 516 L600 525 L610 516 Z"/>
    <path d="M590 616 L600 625 L610 616 Z"/>

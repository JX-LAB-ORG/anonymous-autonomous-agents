<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>

<g font-family="DejaVu Sans, Arial, sans-serif" fill="#111">
  <text x="600" y="55"
        text-anchor="middle"
        font-size="30"
        font-weight="700">
    Feedback-Driven Adaptation
  </text>

  <text x="600" y="88"
        text-anchor="middle"
        font-size="17">
    Operational outcomes can become information for subsequent decisions
  </text>

  <g stroke="#111" stroke-width="2" fill="white">
    <circle cx="600" cy="180" r="72"/>
    <circle cx="850" cy="315" r="72"/>
    <circle cx="755" cy="555" r="72"/>
    <circle cx="445" cy="555" r="72"/>
    <circle cx="350" cy="315" r="72"/>
  </g>

  <g font-size="20"
     font-weight="600"
     text-anchor="middle">

    <text x="600" y="174">Observe</text>
    <text x="600" y="200"
          font-size="15"
          font-weight="400">
      environment
    </text>

    <text x="850" y="309">Reason</text>
    <text x="850" y="335"
          font-size="15"
          font-weight="400">
      form hypothesis
    </text>

    <text x="755" y="549">Act</text>
    <text x="755" y="575"
          font-size="15"
          font-weight="400">
      execute decision
    </text>

    <text x="445" y="549">Result</text>
    <text x="445" y="575"
          font-size="15"
          font-weight="400">
      success / defense
    </text>

    <text x="350" y="309">Adapt</text>
    <text x="350" y="335"
          font-size="15"
          font-weight="400">
      modify strategy
    </text>
  </g>

  <g stroke="#111"
     stroke-width="2"
     fill="none">

    <path d="M665 216
             C735 240 790 260 818 280"/>

    <path d="M870 387
             C850 445 820 485 795 500"/>

    <path d="M685 570
             C610 595 560 595 515 570"/>

    <path d="M395 500
             C370 455 350 415 340 386"/>

    <path d="M335 245
             C380 205 430 190 525 180"/>
  </g>

  <g fill="#111">
    <path d="M808 273 L820 281 L808 288 Z"/>
    <path d="M801 494 L797 508 L788 497 Z"/>
    <path d="M518 562 L506 570 L518 578 Z"/>
    <path d="M333 390 L340 378 L347 390 Z"/>
    <path d="M520 172 L531 180 L519 188 Z"/>
  </g>

  <rect x="470" y="325"
        width="260"
        height="80"
        rx="12"
        fill="white"
        stroke="#555"
        stroke-width="2"
        stroke-dasharray="7 6"/>

  <text x="600" y="356"
        text-anchor="middle"
        font-size="17"
        font-weight="700">
    Operational Memory
  </text>

  <text x="600" y="382"
        text-anchor="middle"
        font-size="14">
    state, observations, prior outcomes
  </text>

  <text x="600" y="675"
        text-anchor="middle"
        font-size="15">
    The model does not assume perfect adaptation; it treats feedback as an information channel.
  </text>
</g>
</svg>